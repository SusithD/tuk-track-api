services:
  - type: web
    name: tuk-track-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tuk-track-db
          property: connectionString

databases:
  - name: tuk-track-db
    plan: free
    region: singapore
    databaseName: tuktrack
    user: tuktrack
