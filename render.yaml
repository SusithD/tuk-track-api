services:
  - type: web
    name: tuk-track-api
    runtime: node
    plan: free
    region: singapore
    # Render's Node runtime auto-activates corepack from package.json's
    # `packageManager` field, so an explicit `corepack enable` is unnecessary
    # AND fails because /usr/bin is read-only on the build host.
    buildCommand: yarn install --immutable && yarn migrate && yarn seed
    startCommand: yarn start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tuk-track-db
          property: connectionString

databases:
  - name: tuk-track-db
    plan: free
    region: singapore
    databaseName: tuktrack
    user: tuktrack
