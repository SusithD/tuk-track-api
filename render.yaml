services:
  - type: web
    name: tuk-track-api
    runtime: node
    plan: free
    region: singapore
    # Render's global yarn is v1; package.json pins yarn 4 via the
    # `packageManager` field. We can't run `corepack enable` (it tries to
    # write shims to /usr/bin, which is read-only on the build host), so
    # we invoke yarn through corepack directly — corepack resolves the
    # right version per call.
    buildCommand: corepack yarn install --immutable && corepack yarn migrate && corepack yarn seed
    startCommand: corepack yarn start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tuk-track-db
          property: connectionString

databases:
  - name: tuk-track-db
    plan: free
    region: singapore
    databaseName: tuktrack
    user: tuktrack
