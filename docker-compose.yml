services:
  postgres:
    image: postgres:16-alpine
    container_name: tuk-track-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tuktrack
    ports:
      - '5433:5432'
    volumes:
      - tuk_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Browser UI for the local Postgres. Open http://localhost:8081 after
  # `docker compose up -d`. Read-only credentials are baked in for convenience.
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: tuk-track-pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tuktrack?sslmode=disable
    ports:
      - '8081:8081'

volumes:
  tuk_pgdata:
